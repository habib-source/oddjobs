services:
  spark:
    restart: always
    image: spark:4.2.0-scala2.13-java25-python3-ubuntu
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      - SPARK_MASTER_HOST=0.0.0.0
      - SPARK_PUBLIC_DNS=spark
  spark-worker:
    restart: always
    image: spark:4.2.0-scala2.13-java25-python3-ubuntu
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark:7077
    ports:
      - "8081:8081"
    depends_on:
      - spark
    environment:
      - SPARK_WORKER_CORES=3
      - SPARK_WORKER_MEMORY=2g
      - SPARK_PUBLIC_DNS=spark-worker
  spark-runner:
    restart: always
    image: spark:4.2.0-scala2.13-java25-python3-ubuntu
    command: /bin/bash
    stdin_open: true # Keeps STDIN open (-i)
    tty: true        # Allocates a pseudo-TTY (-t)
    volumes:
      - ./oddjobs-etl/:/opt/spark/work-dir
